<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlitchVyr Retro Cars</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Retro Style -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        /* Custom scrollbar reset */
        ::-webkit-scrollbar {
            display: none;
        }
        /* Scanline retro effect overlay */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        /* Brick LCD effect background optional style */
        .lcd-bg {
            background-color: #8b956d;
            background-image: radial-gradient(#7c865e 15%, transparent 16%), radial-gradient(#7c865e 15%, transparent 16%);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 overflow-hidden select-none">

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center px-4 py-2 bg-slate-900/80 backdrop-blur rounded-2xl border border-slate-800 shadow-lg z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-car-side text-emerald-400 text-xl"></i>
            <span class="pixel-font text-xs sm:text-sm text-emerald-400 tracking-wider">GLITCHVYR</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="soundToggle" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center text-slate-300 border border-slate-700">
                <i id="soundIcon" class="fa-solid fa-volume-high text-emerald-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Game Frame -->
    <main class="relative w-full max-w-md my-auto flex flex-col items-center justify-center">
        <!-- Game Stats Bar -->
        <div class="w-full bg-slate-900 border-t border-x border-slate-800 rounded-t-2xl p-3 flex justify-between items-center pixel-font text-[10px] sm:text-xs">
            <div class="flex flex-col gap-1">
                <span class="text-slate-400">SCORE</span>
                <span id="scoreText" class="text-amber-400 text-sm">0000</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <span class="text-slate-400">SPEED</span>
                <span id="speedText" class="text-cyan-400 text-sm">LVL 1</span>
            </div>
            <div class="flex flex-col items-end gap-1">
                <span class="text-slate-400">BEST</span>
                <span id="highScoreText" class="text-emerald-400 text-sm">0000</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full aspect-[2/3] bg-slate-900 border-4 border-slate-800 rounded-b-2xl overflow-hidden shadow-2xl">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <!-- CRT Scanlines Effect Overlay -->
            <div class="absolute inset-0 scanlines opacity-60"></div>

            <!-- Start / Game Over Modal Overlay -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity duration-300">
                <div id="startView" class="flex flex-col items-center gap-4">
                    <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center border border-emerald-500/30 text-emerald-400 text-3xl mb-2 animate-bounce">
                        <i class="fa-solid fa-[#f59e0b] fa-gamepad text-emerald-400"></i>
                    </div>
                    <h1 class="pixel-font text-xl text-emerald-400 leading-relaxed">2-LANE<br>RACING</h1>
                    <p class="text-slate-400 text-xs max-w-[220px]">Avoid oncoming traffic on two lanes! Touch sides or use arrow keys.</p>
                    <button id="startBtn" class="mt-4 px-8 py-3 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-bold rounded-xl pixel-font text-xs shadow-lg shadow-emerald-500/20 transition flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> START GAME
                    </button>
                </div>

                <div id="gameOverView" class="hidden flex-col items-center gap-4">
                    <div class="w-16 h-16 bg-rose-500/10 rounded-2xl flex items-center justify-center border border-rose-500/30 text-rose-500 text-3xl mb-2">
                        <i class="fa-solid fa-burst"></i>
                    </div>
                    <h2 class="pixel-font text-xl text-rose-500">GAME OVER</h2>
                    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 w-full max-w-[220px] flex flex-col gap-2 my-2 pixel-font text-xs">
                        <div class="flex justify-between text-slate-400">
                            <span>SCORE:</span>
                            <span id="finalScore" class="text-amber-400">0</span>
                        </div>
                        <div class="flex justify-between text-slate-400">
                            <span>BEST:</span>
                            <span id="finalBest" class="text-emerald-400">0</span>
                        </div>
                    </div>
                    <button id="restartBtn" class="mt-2 px-8 py-3 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold rounded-xl pixel-font text-xs shadow-lg shadow-amber-500/20 transition flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> PLAY AGAIN
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Touch Control Buttons for Mobile / Web App -->
    <footer class="w-full max-w-md grid grid-cols-2 gap-3 mt-3 z-10">
        <button id="btnLeft" class="py-4 rounded-2xl bg-slate-900 border-2 border-slate-800 hover:bg-slate-800 active:bg-emerald-500/20 active:border-emerald-500 active:scale-95 transition flex flex-col items-center justify-center gap-1 shadow-lg text-slate-200">
            <i class="fa-solid fa-arrow-left text-2xl text-emerald-400"></i>
            <span class="pixel-font text-[9px] text-slate-400">LEFT</span>
        </button>
        <button id="btnRight" class="py-4 rounded-2xl bg-slate-900 border-2 border-slate-800 hover:bg-slate-800 active:bg-emerald-500/20 active:border-emerald-500 active:scale-95 transition flex flex-col items-center justify-center gap-1 shadow-lg text-slate-200">
            <i class="fa-solid fa-arrow-right text-2xl text-emerald-400"></i>
            <span class="pixel-font text-[9px] text-slate-400">RIGHT</span>
        </button>
    </footer>

    <!-- JavaScript Game Engine -->
    <script>
        // Web Audio API Sound Generator
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playBeep(freq = 440, type = 'square', duration = 0.08, vol = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playMove() {
                this.playBeep(320, 'triangle', 0.05, 0.12);
            }

            playScore() {
                this.playBeep(880, 'square', 0.1, 0.08);
            }

            playCrash() {
                if (this.muted || !this.ctx) return;
                try {
                    // Noise buffer for explosion/crash effect
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.4);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    noise.start();
                } catch (e) {}
            }
        }

        const audio = new SoundEngine();

        // Game Variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // DOM Elements
        const overlay = document.getElementById('overlay');
        const startView = document.getElementById('startView');
        const gameOverView = document.getElementById('gameOverView');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const speedText = document.getElementById('speedText');
        const finalScore = document.getElementById('finalScore');
        const finalBest = document.getElementById('finalBest');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');

        // Game State
        let isRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('glitchvyr_cars_highscore') || 0;
        highScoreText.textContent = String(highScore).padStart(4, '0');

        let playerLane = 0; // 0 = Left Lane, 1 = Right Lane
        let roadOffset = 0;
        let speedLevel = 1;
        let baseSpeed = 5;
        let obstacleSpawnTimer = 0;
        let obstacles = [];

        // Resize Canvas to container dynamically
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Sound Toggle
        soundToggle.addEventListener('click', () => {
            audio.muted = !audio.muted;
            if (audio.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-emerald-400';
            }
        });

        // Player Controls Logic
        function moveLeft() {
            if (!isRunning) return;
            if (playerLane !== 0) {
                playerLane = 0;
                audio.playMove();
            }
        }

        function moveRight() {
            if (!isRunning) return;
            if (playerLane !== 1) {
                playerLane = 1;
                audio.playMove();
            }
        }

        // Button Event Listeners
        btnLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft(); });
        btnRight.addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight(); });

        // Screen Side Click/Tap Controls
        canvas.addEventListener('pointerdown', (e) => {
            if (!isRunning) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX < canvas.width / 2) {
                moveLeft();
            } else {
                moveRight();
            }
        });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                moveLeft();
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                moveRight();
            } else if ((e.key === ' ' || e.key === 'Enter') && !isRunning) {
                startGame();
            }
        });

        // Start & Restart Game
        function startGame() {
            audio.init();
            score = 0;
            playerLane = 0;
            obstacles = [];
            baseSpeed = 5;
            speedLevel = 1;
            roadOffset = 0;
            obstacleSpawnTimer = 0;
            isRunning = true;

            scoreText.textContent = '0000';
            speedText.textContent = 'LVL 1';

            overlay.classList.add('opacity-0', 'pointer-events-none');
            startView.classList.add('hidden');
            gameOverView.classList.add('hidden');

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Spawn Obstacle Car
        function spawnObstacle() {
            const lane = Math.random() < 0.5 ? 0 : 1;
            // Prevent spawning impossible obstacles directly adjacent
            if (obstacles.length > 0) {
                const last = obstacles[obstacles.length - 1];
                if (last.y < 120) return; // distance check
            }
            obstacles.push({
                lane: lane,
                y: -90,
                color: Math.random() < 0.5 ? '#f43f5e' : '#3b82f6' // Pink/Red or Blue enemy cars
            });
        }

        // Game Over Handler
        function triggerGameOver() {
            isRunning = false;
            audio.playCrash();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('glitchvyr_cars_highscore', highScore);
                highScoreText.textContent = String(highScore).padStart(4, '0');
            }

            finalScore.textContent = Math.floor(score);
            finalBest.textContent = Math.floor(highScore);

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            gameOverView.classList.remove('hidden');
            gameOverView.classList.add('flex');
        }

        // Draw Pixel Style Car
        function drawCar(x, y, width, height, mainColor, isPlayer = false) {
            ctx.save();
            
            // Main Body Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(x - width/2 + 3, y + 4, width, height);

            // Car Base Body
            ctx.fillStyle = mainColor;
            ctx.fillRect(x - width/2, y, width, height);

            // Wheels
            ctx.fillStyle = '#0f172a';
            const wheelW = 6;
            const wheelH = 14;
            ctx.fillRect(x - width/2 - 3, y + 8, wheelW, wheelH); // Top Left
            ctx.fillRect(x + width/2 - 3, y + 8, wheelW, wheelH); // Top Right
            ctx.fillRect(x - width/2 - 3, y + height - 20, wheelW, wheelH); // Bottom Left
            ctx.fillRect(x + width/2 - 3, y + height - 20, wheelW, wheelH); // Bottom Right

            // Cabin Roof / Windshield
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(x - width/2 + 6, y + 20, width - 12, height - 35);

            // Roof highlight
            ctx.fillStyle = mainColor;
            ctx.fillRect(x - width/2 + 8, y + 28, width - 16, height - 48);

            // Lights (Headlights or Taillights depending on orientation)
            if (isPlayer) {
                // Front Headlights (Yellow/White)
                ctx.fillStyle = '#fde047';
                ctx.fillRect(x - width/2 + 4, y + 2, 6, 4);
                ctx.fillRect(x + width/2 - 10, y + 2, 6, 4);

                // Rear Taillights (Red)
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(x - width/2 + 4, y + height - 4, 6, 3);
                ctx.fillRect(x + width/2 - 10, y + height - 4, 6, 3);
            } else {
                // Enemy driving down - Headlights face down (Yellow)
                ctx.fillStyle = '#fde047';
                ctx.fillRect(x - width/2 + 4, y + height - 4, 6, 4);
                ctx.fillRect(x + width/2 - 10, y + height - 4, 6, 4);

                // Enemy Taillights at top (Red)
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(x - width/2 + 4, y + 2, 6, 3);
                ctx.fillRect(x + width/2 - 10, y + 2, 6, 3);
            }

            ctx.restore();
        }

        // Main Game Loop
        function gameLoop() {
            if (!isRunning) return;

            // Update Game Logic
            score += 0.2;
            scoreText.textContent = String(Math.floor(score)).padStart(4, '0');

            // Difficulty progression
            speedLevel = 1 + Math.floor(score / 150);
            speedText.textContent = `LVL ${speedLevel}`;
            const currentSpeed = baseSpeed + (speedLevel * 0.8);

            // Animate Road
            roadOffset = (roadOffset + currentSpeed) % 40;

            // Spawn Obstacles
            obstacleSpawnTimer++;
            const spawnInterval = Math.max(35, 75 - (speedLevel * 4));
            if (obstacleSpawnTimer > spawnInterval) {
                spawnObstacle();
                obstacleSpawnTimer = 0;
            }

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += currentSpeed;

                // Remove out-of-bounds obstacles
                if (obstacles[i].y > canvas.height + 100) {
                    obstacles.splice(i, 1);
                    audio.playScore();
                }
            }

            // Clear Frame
            ctx.fillStyle = '#0f172a'; // Road side grass/dark margin
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road Track Geometry
            const roadMargin = 20;
            const roadWidth = canvas.width - (roadMargin * 2);
            const laneWidth = roadWidth / 2;

            // Draw Asphalt
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(roadMargin, 0, roadWidth, canvas.height);

            // Outer Road Borders
            ctx.fillStyle = '#10b981'; // Neon Emerald borders
            ctx.fillRect(roadMargin - 4, 0, 4, canvas.height);
            ctx.fillRect(canvas.width - roadMargin, 0, 4, canvas.height);

            // Center Dashed Lane Divider
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Player Dimensions & Position
            const carW = Math.min(42, laneWidth * 0.55);
            const carH = carW * 1.7;
            const playerY = canvas.height - carH - 25;
            const lane0X = roadMargin + (laneWidth / 2);
            const lane1X = roadMargin + laneWidth + (laneWidth / 2);
            const playerX = playerLane === 0 ? lane0X : lane1X;

            // Draw Enemy Cars & Collision Check
            obstacles.forEach(obs => {
                const obsX = obs.lane === 0 ? lane0X : lane1X;
                drawCar(obsX, obs.y, carW, carH, obs.color, false);

                // Collision Detection Box
                const hitPadding = 8; // For forgiving arcade feel
                if (
                    obs.lane === playerLane &&
                    obs.y + carH - hitPadding > playerY &&
                    obs.y + hitPadding < playerY + carH
                ) {
                    triggerGameOver();
                }
            });

            // Draw Player Car
            if (isRunning) {
                drawCar(playerX, playerY, carW, carH, '#10b981', true); // Emerald Player Car
            }

            if (isRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
